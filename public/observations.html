<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 導入示範學校｜公開觀課填報</title>
  <meta name="description" content="填報與查看公開觀課資料及六大 AI 教學應用模式。" />
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/common.js" defer></script>
  <script src="/observations.js" defer></script>
</head>
<body>
  <main class="site-shell">
    <div class="top-rule"></div>
    <div class="workspace">
      <header class="header">
        <div class="brand">
          <div class="brand-mark" data-icon="eye" data-size="22"></div>
          <div>
            <span class="brand-kicker">AI 導入示範學校</span>
            <strong>公開觀課填報</strong>
          </div>
        </div>
        <nav class="site-nav" aria-label="頁面">
          <a href="/">期程統整</a>
          <a href="/observations" aria-current="page">公開觀課填報</a>
        </nav>
      </header>

      <section class="intro">
        <div>
          <p class="eyebrow">LESSON OBSERVATION / 公開觀課</p>
          <h1>公開觀課資料，<br class="mobile-break" />集中填報。</h1>
          <p class="intro-copy">記錄每場公開觀課的基本資料；點選「填報公開觀課」填寫與勾選 AI 教學應用模式。</p>
        </div>
        <div id="intro-actions"></div>
      </section>

      <div class="access-banner" id="access-banner"></div>

      <section class="schedule-section">
        <div class="section-top">
          <div>
            <p class="eyebrow">RECORDS</p>
            <h2>觀課紀錄 <span id="record-count"></span></h2>
          </div>
        </div>
        <div class="list" id="record-list" aria-live="polite"></div>
      </section>

      <footer>AI 導入示範學校 <span>／</span> 公開觀課填報</footer>
    </div>
  </main>

  <dialog class="modal" id="modal"></dialog>
  <div class="notice" id="notice" role="status" hidden></div>
</body>
</html>
