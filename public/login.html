<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{TITLE}}｜期程統整</title>
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login-page">
    <div class="login-card">
      <div class="brand">
        <div class="brand-mark">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 2v3"/><path d="M16 2v3"/><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18"/><path d="M8 13h.01"/><path d="M12 13h.01"/><path d="M16 13h.01"/><path d="M8 17h.01"/><path d="M12 17h.01"/><path d="M16 17h.01"/></svg>
        </div>
        <div>
          <span class="brand-kicker">AI 導入示範學校</span>
          <strong>期程統整</strong>
        </div>
      </div>
      <h1>{{TITLE}}</h1>
      <p>{{DESC}}</p>
      <form class="login-form" id="login-form" data-role="{{ROLE}}">
        <label>帳號<input name="username" autocomplete="username" required value="{{USERNAME}}" /></label>
        <label>密碼<input name="password" type="password" autocomplete="current-password" required /></label>
        <p class="form-error" id="login-error" role="alert" hidden></p>
        <button class="submit-button" id="login-submit">登入</button>
      </form>
      <a class="back-link" href="/">返回期程清單</a>
    </div>
  </main>
</body>
</html>
