<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 導入示範學校｜計畫成員</title>
  <meta name="description" content="計畫主持人與協同主持人名單。" />
  <link rel="icon" href="/favicon.svg" />
  <link rel="stylesheet" href="/style.css" />
  <script src="/common.js" defer></script>
  <script src="/team.js" defer></script>
</head>
<body>
  <main class="site-shell">
    <div class="top-rule"></div>
    <div class="workspace">
      <header class="header">
        <div class="brand">
          <div class="brand-mark" data-icon="users" data-size="22"></div>
          <div>
            <span class="brand-kicker">AI 導入示範學校</span>
            <strong>計畫成員</strong>
          </div>
        </div>
      </header>

      <section class="intro">
        <div>
          <p class="eyebrow">PROJECT TEAM / 計畫成員</p>
          <h1>計畫主持人與<br class="mobile-break" />協同主持人名單</h1>
          <p class="intro-copy">點選「新增名單」輸入姓名，即可加入名單。</p>
        </div>
      </section>

      <div class="access-banner" id="access-banner"></div>

      <div class="team-groups" id="team-groups" aria-live="polite"></div>

      <footer>AI 導入示範學校 <span>／</span> 計畫成員</footer>
    </div>
  </main>

  <dialog class="modal" id="modal"></dialog>
  <div class="notice" id="notice" role="status" hidden></div>
</body>
</html>
